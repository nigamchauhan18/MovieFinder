<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MovieFinder</title>
    <style>
        @import url('./assets/font-awesome/css/font-awesome.css');
        @import url('./assets/bootstrap5/css/bootstrap.min.css');
        @import url('https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css');
        @import url('./css/responsive.css');
        @import url('./css/print.css');
        @import url('./css/style.css');
    </style>
</head>
<body>
    <main class="container-fluid flex-grow-1 d-flex justify-content-center align-items-center py-5">
        <div class="row justify-content-center w-100">
            <div class="col-md-4">
                <div class="card border-danger shadow-lg bg-dark text-white">
                    <div class="card-body">
                        <div class="text-center mb-4">
                            <div class="mb-3">
                                <i class="fa-solid fa-user-plus text-danger" style="font-size: 30px;"></i>
                            </div>
                            <h2 class="fw-bold">Create Account</h2>
                            <p class="text-secondary mb-0">Join Movie<span class="text-danger"> Finder</span> today</p>
                        </div>
                        <form id="signupForm">
                            <div class="mb-3">
                                <label for="signupName" class="form-label fw-semibold">Full Name</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-dark border-secondary text-danger">
                                        <i class="fa-solid fa-user"></i>
                                    </span>
                                    <input type="text" class="form-control bg-dark text-white border-secondary" id="signupName" placeholder="Enter your full name" autocomplete="name">
                                </div>
                                <small id="nameError" class="text-danger"></small>
                            </div>
                            <div class="mb-3">
                                <label for="signupEmail" class="form-label fw-semibold">Email Address</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-dark border-secondary text-danger">
                                        <i class="fa-solid fa-envelope"></i>
                                    </span>
                                    <input type="email" class="form-control bg-dark text-white border-secondary" id="signupEmail" placeholder="Enter your email" autocomplete="email">
                                </div>
                                <small id="emailError" class="text-danger"></small>
                            </div>
                            <div class="mb-3">
                                <label for="signupPassword" class="form-label fw-semibold">Password</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-dark border-secondary text-danger">
                                        <i class="fa-solid fa-lock"></i>
                                    </span>
                                    <input type="password" class="form-control bg-dark text-white border-secondary" id="signupPassword" placeholder="Create a password" autocomplete="new-password">
                                    <button type="button" class="btn btn-outline-secondary" id="passwordToggle">
                                        <i class="fa-solid fa-eye"></i>
                                    </button>
                                </div>
                                <small id="passwordError" class="text-danger"></small>
                            </div>
                            <div class="mb-3">
                                <label for="confirmPassword" class="form-label fw-semibold">Confirm Password</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-dark border-secondary text-danger">
                                        <i class="fa-solid fa-lock"></i>
                                    </span>
                                    <input type="password" class="form-control bg-dark text-white border-secondary" id="confirmPassword" placeholder="Confirm your password" autocomplete="new-password">
                                    <button type="button" class="btn btn-outline-secondary" id="confirmPasswordToggle">
                                        <i class="fa-solid fa-eye"></i>
                                    </button>
                                </div>
                                <small id="confirmPasswordError" class="text-danger"></small>
                            </div>
                            <div class="form-check mb-4">
                                <input class="form-check-input" type="checkbox" id="terms">
                                <label class="form-check-label text-secondary" for="terms">
                                    I agree to the <a href="/" class="text-danger text-decoration-none">Terms & Conditions</a>
                                </label>
                                <br>
                                <small id="termsError" class="text-danger"></small>
                            </div>
                            <button type="submit" class="btn btn-danger w-100 py-2 fw-semibold">
                                <i class="fa-solid fa-user-plus"></i> Create Account
                            </button>
                        </form>
                        <div id="successMessage" class="alert alert-success mt-4 mb-0" style="display: none;">
                            <i class="fa-solid fa-circle-check"></i> Account created successfully!
                        </div>
                        <div class="text-center mt-4">
                            <p class="text-secondary mb-0">Already have an account?
                                <a href="login.html" class="text-danger fw-semibold text-decoration-none">Login</a>
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <script src="./assets/bootstrap5/js/bootstrap.bundle.js"></script>
    <script src="./js/signup.js"></script>
</body>
</html>
