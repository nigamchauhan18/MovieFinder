<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MovieFinder | Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" >
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/home.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <main class="login-page">
        <div class="login-container">
            <a href="index.html" class="login-logo">
                <i class="fa-solid fa-film"></i> MovieFinder
            </a>
            <div class="login-card">
                <div class="login-icon">
                    <i class="fa-solid fa-user"></i>
                </div>
                <h1>Welcome Back!</h1>
                <p class="login-subtitle">
                    Sign in to save your favorite movies and manage your watchlist.
                </p>
                <div id="loginError" class="login-error" role="alert"></div>
                <form id="loginForm">
                    <div class="form-group">
                        <label for="userName">Full Name</label>
                        <div class="input-wrapper">
                            <i class="fa-regular fa-user"></i>
                            <input type="text" id="userName" placeholder="Enter your full name" autocomplete="name" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="userEmail">Email Address</label>
                        <div class="input-wrapper">
                            <i class="fa-regular fa-envelope"></i>
                            <input type="email" id="userEmail" placeholder="Enter your email" autocomplete="email" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="userPassword">Password</label>
                        <div class="input-wrapper">
                            <i class="fa-solid fa-lock"></i>
                            <input type="password" id="userPassword" placeholder="Enter your password" autocomplete="current-password" required minlength="6" >
                            <button type="button" class="password-toggle" id="togglePassword" aria-label="Show password">
                                <i class="fa-regular fa-eye"></i>
                            </button>
                        </div>
                    </div>
                    <button type="submit" class="login-submit">
                        Login <i class="fa-solid fa-arrow-right ms-2"></i>
                    </button>
                </form>
                <p class="signup-prompt">
                    Don't have an account? <a href="signup.html">Create Account</a>
                </p>
                <p class="login-note">
                    Frontend demo: any name, valid email, and password of at least 6 characters will work. This form does not verify an account.
                </p>
                <a href="index.html" class="back-home">
                    <i class="fa-solid fa-arrow-left me-2"></i> Back to Home
                </a>
            </div>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
